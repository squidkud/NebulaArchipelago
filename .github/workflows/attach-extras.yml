# Attaches the YAML template (release-extras/) and a freshly built PopTracker pack with its versions.json to an existing release.
# Run it from the Actions tab with the tag, for example v1.0.2.
name: attach-extras
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.0.2'
        required: true
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install pillow
          python3 tools/poptracker_release.py "${{ github.event.inputs.tag }}" poptracker
          gh release upload "${{ github.event.inputs.tag }}" "release-extras/Nebula.yaml" poptracker/SMG-PC-Port-PopTracker.zip poptracker/versions.json --clobber
